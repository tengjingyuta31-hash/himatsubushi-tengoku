<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="無料の雑学クイズ、心理テスト、動物雑学を楽しめるヒマつぶし天国"><title>ヒマつぶし天国</title><style>body{margin:0;background:linear-gradient(#9bdeff,#e7faff);color:#20415a;font-family:system-ui,sans-serif}header{text-align:center;background:#61c5ff;padding:35px 10px}h1{color:white;font-size:clamp(30px,8vw,52px);text-shadow:1px 3px 6px #508ba5}main{max-width:750px;margin:auto;padding:15px}section{background:white;border-radius:25px;padding:25px;margin:20px 0;box-shadow:0 5px 20px #3990ac24}button,select{font:inherit;border:0;border-radius:18px;padding:15px;margin:6px 0;cursor:pointer}button{background:#ff806e;color:white;font-weight:bold}button:focus-visible{outline:3px solid #125b94}.answer{display:block;width:100%;text-align:left;background:#e4f3ff;color:#20415a}.answer:disabled{opacity:.7}.correct{background:#b9efce!important;opacity:1!important}.hidden{display:none}.result{background:#e7f6ff;padding:15px;border-radius:15px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button{background:#fff;color:#245a78}.muted{color:#58788a}footer{text-align:center;padding:25px}</style><header><div style="font-size:65px">🌈 ☁️ ☀️</div><h1>ヒマつぶし天国</h1><h3>ちょっとの暇が、楽しい時間に！</h3></header><main><nav class="nav"><button onclick="show('home')">🏠 ホーム</button><button onclick="start()">🎯 クイズ</button><button onclick="show('tests')">💖 心理テスト</button><button onclick="show('animals')">🐶 動物雑学</button></nav><div id="home"><section><h2>📅 今日のクイズ</h2><p id="daily"></p><button onclick="daily()">挑戦する</button></section><section><h2>🎯 雑学クイズ</h2><p>20問の問題集からランダムに10問出題！</p><button onclick="start()">遊んでみる</button></section><section><h2>💖 心理テスト10種類</h2><p>気軽に楽しめるエンタメ診断。</p><button onclick="show('tests')">診断してみる</button></section><section><h2>🐾 動物の豆知識</h2><button onclick="show('animals')">読んでみる</button></section></div><div id="quiz" class="hidden"><section><h2>🎯 雑学クイズ</h2><div id="qb"></div></section></div><div id="tests" class="hidden"><section><h2>💖 心理テスト</h2><select id="select" onchange="test()"></select><div id="tb"></div></section></div><div id="animals" class="hidden"><section><h2>🐶 動物の雑学</h2><div id="ab"></div></section></div><section><h2>🌟 ヒマつぶし天国について</h2><p>無料で遊べるエンタメサイトです。クイズや診断を楽しんでください。</p><small>※心理テストは娯楽目的で、科学的診断ではありません。</small></section></main><footer>© 2026 ヒマつぶし天国</footer><script>const qs=[{"q": "日本で一番高い山は？", "a": ["富士山", "北岳", "槍ヶ岳"], "c": 0}, {"q": "パンダが主に食べるものは？", "a": ["魚", "竹", "肉"], "c": 1}, {"q": "月が地球を一周する周期は約？", "a": ["7日", "27日", "100日"], "c": 1}, {"q": "タコの心臓はいくつ？", "a": ["1つ", "2つ", "3つ"], "c": 2}, {"q": "地球の表面の約何割が海？", "a": ["3割", "5割", "7割"], "c": 2}, {"q": "日本で最も長い川は？", "a": ["利根川", "信濃川", "石狩川"], "c": 1}, {"q": "ペンギンは何の仲間？", "a": ["哺乳類", "鳥類", "魚類"], "c": 1}, {"q": "キリンの首の骨は何個？", "a": ["7個", "14個", "21個"], "c": 0}, {"q": "日本の国鳥は？", "a": ["キジ", "ツル", "スズメ"], "c": 0}, {"q": "世界最大の海洋は？", "a": ["大西洋", "インド洋", "太平洋"], "c": 2}, {"q": "太陽は何の仲間？", "a": ["惑星", "恒星", "衛星"], "c": 1}, {"q": "水が標準気圧で沸騰する温度は？", "a": ["50℃", "100℃", "150℃"], "c": 1}, {"q": "虹は日本で一般に何色？", "a": ["5色", "7色", "9色"], "c": 1}, {"q": "世界最大の陸上動物は？", "a": ["アフリカゾウ", "キリン", "カバ"], "c": 0}, {"q": "植物が光で養分を作る働きは？", "a": ["光合成", "発酵", "蒸発"], "c": 0}, {"q": "日本で面積最大の都道府県は？", "a": ["北海道", "岩手県", "長野県"], "c": 0}, {"q": "成人の骨の数は一般に？", "a": ["106個", "206個", "306個"], "c": 1}, {"q": "光の速さは秒速約？", "a": ["30万km", "300km", "3000km"], "c": 0}, {"q": "地球に最も近い恒星は？", "a": ["太陽", "シリウス", "北極星"], "c": 0}, {"q": "日本の首都機能が集中するのは？", "a": ["大阪", "東京", "京都"], "c": 1}],ts=["休日の過ごし方", "隠れた強み", "旅行スタイル", "動物タイプ", "集中タイプ", "友情タイプ", "ひらめきタイプ", "食の冒険度", "リラックス法", "未来への向き合い方"];let order=[],pos=0,score=0,done=false;function show(id){for(let x of ['home','quiz','tests','animals'])document.getElementById(x).classList.toggle('hidden',x!==id);scrollTo(0,0)}function start(){order=[...qs].sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;show('quiz');render()}function daily(){let d=new Date();order=[qs[(d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate())%qs.length]];pos=0;score=0;show('quiz');render()}function render(){done=false;let b=document.getElementById('qb');if(pos>=order.length){b.innerHTML='<h2>🎉 結果 '+score+' / '+order.length+'問 正解！</h2><button onclick="start()">もう一度遊ぶ</button>';return}let q=order[pos];b.innerHTML='<p>第'+(pos+1)+'問 / '+order.length+'問</p><h2>'+q.q+'</h2>'+q.a.map((a,i)=>'<button class="answer" onclick="answer('+i+')">'+a+'</button>').join('')+'<div id="fb"></div>'}function answer(i){if(done)return;done=true;let q=order[pos];if(i===q.c)score++;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct')});document.getElementById('fb').innerHTML='<div class="result">'+(i===q.c?'🎉 正解！':'💡 正解は '+q.a[q.c])+'</div><button onclick="pos++;render()">次へ →</button>'}document.getElementById('select').innerHTML=ts.map((x,i)=>'<option value="'+i+'">'+x+'</option>').join('');function test(){let x=ts[+document.getElementById('select').value];document.getElementById('tb').innerHTML='<h3>'+x+'</h3><p>休日に一番したいことは？</p>'+['外に出る','家でのんびり','新しいことをする'].map((a,i)=>'<button class="answer" onclick="tr('+i+')">'+a+'</button>').join('')+'<div id="tr"></div>'}function tr(i){document.getElementById('tr').innerHTML='<div class="result"><h3>✨ 診断結果</h3>'+['行動派タイプ！好奇心旺盛です。','癒やし派タイプ！自分のペースを大切にします。','冒険派タイプ！新しい発見が好きです。'][i]+'<p><small>娯楽としてお楽しみください。</small></p></div>'}test();document.getElementById('ab').innerHTML=['ラッコは眠るとき海藻に体を巻き付けることがあります。','コアラの指紋は人間の指紋によく似ています。','イルカは脳の半分ずつを休ませる睡眠をします。','ウォンバットのフンは立方体に近い形です。','フラミンゴのピンク色は食べ物に由来します。','カラスは人の顔を見分けられます。','ミツバチはダンスで餌の場所を伝えます。','ナマケモノはゆっくり動いてエネルギーを節約します。'].map((x,i)=>'<h3>🐾 '+(i+1)+'</h3><p>'+x+'</p><hr>').join('');let d=new Date();document.getElementById('daily').textContent=qs[(d.getFullYear()*372+(d.getMonth()+1)*31+d.getDate())%qs.length].q;</script></html>
