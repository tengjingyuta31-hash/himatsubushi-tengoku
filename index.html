<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="雑学クイズと心理テストで楽しい暇つぶし！"><title>ヒマつぶし天国 🌈</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans JP',sans-serif;color:#17385c;background:linear-gradient(#8bd6ff 0%,#d9f5ff 45%,#fff7d9 100%);min-height:100vh}header{text-align:center;padding:38px 16px 30px;background:linear-gradient(135deg,#46b8ff,#8bdbff)}h1{font-size:clamp(2rem,8vw,3.3rem);margin:8px 0;color:#fff;text-shadow:0 3px 8px #247db0}.rainbow{font-size:3.5rem}header p{color:#07446c;font-weight:700}main{max-width:900px;margin:auto;padding:22px 16px 55px}.intro{text-align:center;font-weight:700;font-size:1.15rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin:24px 0}.card,.panel{background:#ffffffeb;border-radius:22px;padding:22px;box-shadow:0 8px 24px #1c6d9826}.card{text-align:center}.icon{font-size:3rem}.card h2{margin:10px 0}.card p{line-height:1.6}button{border:0;background:#ff7c63;color:white;font-size:1rem;font-weight:800;padding:12px 22px;border-radius:999px;cursor:pointer;min-height:44px}button:hover{filter:brightness(.95)}.panel{margin-top:22px;scroll-margin-top:18px}.panel h2{margin-top:0}.choices{display:grid;gap:10px}.choices button{background:#e7f6ff;color:#15547b;border:2px solid #b8e5ff;text-align:left;border-radius:12px}.choices button:focus-visible,button:focus-visible{outline:3px solid #ffb400;outline-offset:3px}.result{font-size:1.1rem;font-weight:700;min-height:32px;margin-top:16px;line-height:1.7}.fact{line-height:1.8}footer{text-align:center;background:#e4f7ff;padding:22px;font-size:.85rem}small{display:block;margin-top:10px}a{color:#075b9c}
</style></head><body><header><div class="rainbow" aria-hidden="true">🌈 ☁️ ☀️</div><h1>ヒマつぶし天国</h1><p>ちょっとの暇が、楽しい時間に！</p></header><main><p class="intro">🎉 雑学・クイズ・心理テストを無料で楽しもう！</p><div class="grid"><article class="card"><div class="icon">🎯</div><h2>雑学クイズ</h2><p>知っているようで知らない豆知識に挑戦！</p><button onclick="go('quiz')">遊んでみる</button></article><article class="card"><div class="icon">💖</div><h2>心理テスト</h2><p>直感で選んで、自分の意外な一面を発見！</p><button onclick="go('personality')">診断してみる</button></article><article class="card"><div class="icon">🧠</div><h2>今日の豆知識</h2><p>思わず誰かに話したくなる小ネタ！</p><button onclick="go('facts')">読んでみる</button></article></div><section class="panel" id="quiz"><h2>🎯 3択雑学クイズ</h2><p id="question"></p><div class="choices" id="answers"></div><p class="result" id="quizResult" aria-live="polite"></p><button onclick="nextQuiz()">次の問題へ →</button></section><section class="panel" id="personality"><h2>💖 かんたん心理テスト</h2><p>休日に突然、自由な時間ができました。最初にしたいことは？</p><div class="choices"><button onclick="personality(0)">🚗 知らない場所へ出かける</button><button onclick="personality(1)">📚 好きなことをじっくり楽しむ</button><button onclick="personality(2)">☕ 誰かとゆっくり話す</button></div><p class="result" id="personalityResult" aria-live="polite"></p><small>※娯楽用の診断です。科学的な性格判定ではありません。</small></section><section class="panel" id="facts"><h2>🧠 今日の豆知識</h2><p class="fact" id="factText"></p><button onclick="nextFact()">別の豆知識を見る →</button></section></main><footer>🌈 ヒマつぶし天国 <small>© 2026 ヒマつぶし天国</small></footer><script>
const quiz=[{q:'タコの心臓はいくつある？',a:['1つ','2つ','3つ'],correct:2,why:'タコには心臓が3つあります。'},{q:'日本で一番面積が大きい都道府県は？',a:['北海道','岩手県','長野県'],correct:0,why:'北海道が日本最大です。'},{q:'虹は一般的に何色として数えられる？',a:['5色','7色','9色'],correct:1,why:'日本では一般的に7色とされます。'}];let qi=0;function go(id){document.getElementById(id).scrollIntoView({behavior:'smooth'})}function renderQuiz(){const x=quiz[qi];document.getElementById('question').textContent=`第${qi+1}問：${x.q}`;document.getElementById('answers').innerHTML='';document.getElementById('quizResult').textContent='';x.a.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{document.getElementById('quizResult').textContent=(i===x.correct?'🎉 正解！ ':'😊 おしい！ ')+x.why;document.querySelectorAll('#answers button').forEach(btn=>btn.disabled=true)};document.getElementById('answers').appendChild(b)})}function nextQuiz(){qi=(qi+1)%quiz.length;renderQuiz()}function personality(i){document.getElementById('personalityResult').textContent=['🌟 好奇心いっぱいの冒険タイプ！新しい体験が元気の源かも。','🌟 こだわりを楽しむ集中タイプ！好きな世界を深く味わうのが得意かも。','🌟 人とのつながりを大切にする交流タイプ！会話から元気をもらうのかも。'][i]}const facts=['🐙 タコには心臓が3つあります。','🍯 蜂蜜は水分が少なく酸性なので、適切に保存すると傷みにくい食品です。','🌙 月は地球から少しずつ遠ざかっています。'];let fi=0;function nextFact(){fi=(fi+1)%facts.length;document.getElementById('factText').textContent=facts[fi]}renderQuiz();nextFact();
</script></body></html>
