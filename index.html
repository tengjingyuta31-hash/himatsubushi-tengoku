<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="雑学クイズ、心理テスト、動物雑学、占いで毎日の暇つぶしを楽しく！"><title>ヒマつぶし天国｜クイズ・心理テスト・雑学</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#173854}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#a4dfff,#e7f9ff)}header{background:linear-gradient(135deg,#43b9ff,#83d9ff);text-align:center;padding:42px 16px 45px}header .sky{font-size:55px}h1{color:white;text-shadow:0 3px 8px #287ab5;font-size:clamp(32px,8vw,52px);margin:12px 0}header p{font-weight:700;font-size:19px}main{max-width:780px;margin:auto;padding:26px 18px 65px}.lead{text-align:center;font-size:20px;font-weight:700;margin:15px 0 28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:18px}.card{background:#ffffffed;border-radius:25px;padding:25px 20px;text-align:center;box-shadow:0 10px 20px #438bb329}.icon{font-size:56px}.card h2{font-size:25px;margin:12px 0}.card p{line-height:1.7;min-height:50px}button{border:0;border-radius:40px;background:#ff806e;color:white;font-size:18px;font-weight:700;padding:13px 25px;cursor:pointer}button:hover{filter:brightness(.96)}.panel{background:white;border-radius:25px;padding:24px;margin-top:26px;box-shadow:0 10px 20px #438bb329}.hidden{display:none}.answers{display:grid;gap:10px;margin:18px 0}.answers button{background:#e6f4ff;color:#17446a;text-align:left;border-radius:12px}.answers button:disabled{opacity:.7}#feedback{font-weight:700;line-height:1.8}.small{font-size:14px;color:#47627b}footer{text-align:center;padding:25px;font-size:13px;color:#45647c}a{color:#176baf}#progress{font-weight:700;color:#2875a0}</style></head><body><header><div class="sky">🌈 ☁️ ☀️</div><h1>ヒマつぶし天国</h1><p>ちょっとの暇が、楽しい時間に！</p></header><main><p class="lead">🎉 雑学・クイズ・心理テストを無料で楽しもう！</p><div class="grid"><section class="card"><div class="icon">🎯</div><h2>雑学クイズ</h2><p>知っているようで知らない豆知識に挑戦！</p><button onclick="startQuiz()">遊んでみる</button></section><section class="card"><div class="icon">💖</div><h2>心理テスト</h2><p>直感で選んで、自分の意外な一面を発見！</p><button onclick="startPersonality()">診断する</button></section><section class="card"><div class="icon">🔮</div><h2>今日の運勢</h2><p>今日の気分を楽しく占ってみよう！</p><button onclick="fortune()">占ってみる</button></section><section class="card"><div class="icon">🐶</div><h2>動物の雑学</h2><p>思わず誰かに話したくなる動物の秘密。</p><button onclick="animal()">読んでみる</button></section></div><section class="panel hidden" id="play" aria-live="polite"><div id="progress"></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback"></p><button id="next" class="hidden" onclick="nextQuestion()">次へ →</button><p class="small" id="note"></p></section><section class="panel"><h2>🌟 ヒマつぶし天国について</h2><p>すきま時間に気軽に楽しめる無料のエンタメサイトです。クイズや診断は娯楽としてお楽しみください。</p><p class="small">※心理テストや占いは娯楽目的で、科学的な診断や未来の予測ではありません。</p></section></main><footer>© 2026 ヒマつぶし天国</footer><script>
const questions=[['日本で最も面積が大きい都道府県は？',['北海道','岩手県','長野県'],0,'北海道は日本の総面積の約2割を占めます。'],['タコの心臓はいくつ？',['1つ','2つ','3つ'],2,'タコには3つの心臓があります。'],['地球の表面で海が占める割合は約何％？',['約50％','約70％','約90％'],1,'地球の表面の約71％は海です。'],['パンダが主に食べるものは？',['竹','魚','昆虫'],0,'ジャイアントパンダは主に竹を食べます。'],['虹の色は日本では一般に何色とされる？',['5色','7色','9色'],1,'日本では一般に7色と数えます。'],['金星は太陽系で何番目の惑星？',['2番目','3番目','4番目'],0,'太陽から2番目の惑星です。'],['人間の成人の骨は一般に約何個？',['106個','206個','306個'],1,'成人の骨は通常約206個です。'],['ペンギンはどの仲間？',['哺乳類','鳥類','爬虫類'],1,'飛べませんが鳥類です。'],['日本で最も高い山は？',['北岳','富士山','槍ヶ岳'],1,'富士山は標高3776mです。'],['ミツバチが仲間に花の場所を伝える行動は？',['ダンス','歌','ジャンプ'],0,'体を動かすダンスで方向や距離を伝えます。'],['世界最大の動物は？',['アフリカゾウ','シロナガスクジラ','キリン'],1,'シロナガスクジラは現存する最大の動物です。'],['月が地球の周りを一周する周期は約？',['7日','27日','100日'],1,'恒星を基準に約27.3日で一周します。'],['植物が光を使って栄養を作る働きは？',['発酵','光合成','蒸発'],1,'光合成で有機物を作ります。'],['オリンピックの五輪マークの輪の数は？',['4','5','6'],1,'5つの輪が描かれています。'],['日本の硬貨で穴が開いているのは？',['1円と10円','5円と50円','100円と500円'],1,'5円硬貨と50円硬貨です。'],['地球の衛星は？',['月','火星','金星'],0,'月は地球の自然衛星です。'],['カンガルーの赤ちゃんが育つ場所は？',['巣穴','育児嚢','水中'],1,'お腹の袋で育ちます。'],['水が標準気圧で沸騰する温度は？',['80℃','100℃','120℃'],1,'標準気圧では約100℃です。'],['サメの骨格は主に何でできている？',['軟骨','鉄','木'],0,'サメは軟骨魚類です。'],['日本の国鳥は？',['ツル','キジ','スズメ'],1,'キジが日本の国鳥です。']];
let order=[],pos=0,score=0,locked=false;const $=id=>document.getElementById(id);function show(){ $('play').classList.remove('hidden');$('play').scrollIntoView({behavior:'smooth',block:'start'});$('answers').innerHTML='';$('feedback').textContent='';$('next').classList.add('hidden');$('note').textContent='';}function startQuiz(){order=[...questions.keys()].sort(()=>Math.random()-.5).slice(0,10);pos=0;score=0;show();$('next').onclick=nextQuestion;renderQuiz()}function renderQuiz(){locked=false;let q=questions[order[pos]];$('progress').textContent=`第${pos+1}問 / 10問`;$('question').textContent=q[0];$('answers').innerHTML='';q[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(locked)return;locked=true;if(i===q[2])score++;$('feedback').textContent=(i===q[2]?'🎉 正解！ ':'💡 残念！ ')+q[3];$('answers').querySelectorAll('button').forEach(x=>x.disabled=true);$('next').classList.remove('hidden');$('next').textContent=pos===9?'結果を見る':'次へ →'};$('answers').appendChild(b)});$('feedback').textContent='';$('next').classList.add('hidden')};function nextQuestion(){pos++;if(pos===10){$('progress').textContent='結果発表';$('question').textContent=`10問中 ${score}問正解！`;$('answers').innerHTML='';$('feedback').textContent=score>=8?'すごい！雑学マスターですね！':'また挑戦して知識を増やそう！';$('next').textContent='もう一度挑戦';$('next').onclick=startQuiz;}else renderQuiz()}
const tests=[['休日に突然自由時間ができたら？',['外へ出かける','家でのんびり','新しいことに挑戦'],['行動派タイプ：好奇心旺盛で、体験から元気をもらう傾向がありそう！','マイペースタイプ：自分の時間を大切にできる落ち着いた魅力がありそう！','チャレンジャータイプ：新しい発見を楽しめる柔軟な人かも！']],['好きな景色を選ぶなら？',['青い海','緑の森','星空'],['開放感を大切にするタイプかも！','安心できる環境を好むタイプかも！','想像力豊かなタイプかも！']],['プレゼントを選ぶときは？',['実用性を重視','驚きを重視','相手の希望を聞く'],['堅実で気配り上手かも！','遊び心のあるアイデア派かも！','相手の気持ちを尊重するタイプかも！']]];function startPersonality(){show();$('next').onclick=nextQuestion;let t=tests[Math.floor(Math.random()*tests.length)];$('progress').textContent='💖 お楽しみ心理テスト';$('question').textContent=t[0];t[1].forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{$('answers').innerHTML='';$('question').textContent='診断結果';$('feedback').textContent=t[2][i];$('next').classList.remove('hidden');$('next').textContent='別のテストをする';$('next').onclick=()=>{$('next').onclick=nextQuestion;startPersonality()}};$('answers').appendChild(b)});$('note').textContent='※娯楽用の診断です。'}
function fortune(){show();$('next').onclick=nextQuestion;let date=new Date().toLocaleDateString('ja-JP'),n=[...date].reduce((a,c)=>a+c.charCodeAt(0),0)%5;let arr=['小さな発見が楽しい一日になりそう！','気になっていたことに挑戦すると気分転換に！','身近な人との会話が楽しみを運んでくれそう！','休憩を大切にすると充実した時間に！','好きなことに集中すると満足感が高まりそう！'];$('progress').textContent='🔮 今日のお楽しみ運勢';$('question').textContent=['🌟 大吉','🌸 中吉','🍀 吉','☀️ 末吉','🌈 小吉'][n];$('feedback').textContent=arr[n];$('note').textContent='※占いは娯楽です。'}const facts=['ラッコは眠るとき、流されないよう海藻を体に巻くことがあります。','コアラの指紋は人間の指紋とよく似ています。','タコには3つの心臓があります。','イルカは片方の脳を休ませながら眠ることがあります。','キリンの首の骨は、人間と同じく基本的に7個です。','カラスは道具を使うことがある賢い鳥です。','ウォンバットのフンは角ばった形になることで知られています。','フラミンゴのピンク色は食べ物に含まれる色素に由来します。'];let factIndex=0;function animal(){show();$('next').onclick=animal;$('progress').textContent='🐶 動物の面白い雑学';$('question').textContent='知ってた？';$('feedback').textContent=facts[factIndex++%facts.length];$('next').classList.remove('hidden');$('next').textContent='次の雑学を見る';$('next').onclick=animal}
</script></body></html>
